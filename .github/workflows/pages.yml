# Test, build and publish the playable single-file build to GitHub Pages (served from the gh-pages branch).
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/zombs-bbq-game-plan, main]
  workflow_dispatch:

permissions:
  contents: write

# one deploy at a time; a newer push waits for the running one instead of racing it
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site"
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf "$site"
          # keep the branch's history: start from it when it exists, else start it fresh
          if git ls-remote --exit-code --heads "$remote" gh-pages >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch gh-pages "$remote" "$site"
            find "$site" -mindepth 1 -maxdepth 1 ! -name .git ! -name CNAME -exec rm -rf {} +
          else
            mkdir -p "$site"
            git -C "$site" init --quiet --initial-branch gh-pages
          fi
          cp dist/zombs-bbq.html "$site/index.html"
          cp dist/manifest.webmanifest "$site/"
          cp -r dist/icons "$site/"
          touch "$site/.nojekyll"
          cd "$site"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed since the last deploy."
            exit 0
          fi
          git commit --quiet -m "Zombs BBQ playable build for GitHub Pages (from ${GITHUB_SHA::7}, ${GITHUB_REF_NAME})"
          git push --quiet "$remote" HEAD:gh-pages
